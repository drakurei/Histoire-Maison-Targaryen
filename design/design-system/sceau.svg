<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-256 -256 512 512" width="512" height="512" role="img" aria-labelledby="sceau-titre sceau-desc">
  <title id="sceau-titre">Sceau de la bibliothèque</title>
  <desc id="sceau-desc">Une chandelle de verre allumée dans une amande verticale, entourée d'un anneau d'écailles et de quatorze flammes.</desc>
  <!--
    SCEAU DE LA CHANDELLE DE VERRE — dessin original, agent 07.
    Construction : origine au centre, unité = 1/512 du diamètre.
      r 247 / 239,5  listel (filet gras-maigre)
      r 198 → 234    quatorze flammes, une tous les 360/14 = 25,714°, numérotées comme un cadran
                     (flamme-14 en haut, sens horaire)
      r 189          filet
      r 150 → 187    anneau d'écailles : 14 secteurs de 2 rangs × 3 ogives, pointes vers le centre
      r 146          champ, hachuré à l'horizontale (pas de 8)
      amande         deux arcs de rayon 193,26 ; pointes en y = ±134, demi-largeur 54
      chandelle      lame torse, trois arêtes ; flamme en goutte, cœur rouge
    Couleurs en attributs de présentation : toute règle CSS les remplace (animation, thème encre).
    Chaque partie animable porte un id ou une classe. Aucun texte, aucun bitmap, aucun filtre.
  -->

  <defs>
    <clipPath id="sceau-decoupe-champ"><path clip-rule="evenodd" d="M-137 0a137 137 0 1 0 274 0a137 137 0 1 0 -274 0ZM0 -146A198.53 198.53 0 0 1 0 146A198.53 198.53 0 0 1 0 -146Z"/></clipPath>
    <clipPath id="sceau-decoupe-amande"><path d="M0 -134A193.26 193.26 0 0 1 0 134A193.26 193.26 0 0 1 0 -134Z"/></clipPath>
    <radialGradient id="sceau-lueur" cx="0" cy="-70" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6CE96" stop-opacity=".34"/>
      <stop offset="1" stop-color="#E6CE96" stop-opacity="0"/>
    </radialGradient>
    <!-- Marque réduite : dessin optique propre à 24 px, monochrome (currentColor) -->
    <symbol id="sceau-marque" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="miter" d="M12 1.5A12.19 12.19 0 0 1 12 22.5A12.19 12.19 0 0 1 12 1.5Z"/>
      <path fill="currentColor" d="M12 5.5C12.6 7.3 14 8.4 14 10.2A2 2 0 0 1 10 10.2C10 8.4 11.4 7.3 12 5.5Z"/>
      <path fill="currentColor" d="M11.25 13.75H12.75V19H11.25Z"/>
    </symbol>
    <!-- Favicon : dessin optique propre à 16 px, disque plein pour tenir sur onglet clair ou sombre -->
    <symbol id="sceau-favicon" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="8" fill="#0B0A0A"/>
      <path fill="none" stroke="#C8A45A" stroke-width="1.1" d="M8 1.2A7.12 7.12 0 0 1 8 14.8A7.12 7.12 0 0 1 8 1.2Z"/>
      <path fill="#EFE7D6" d="M8 3.2C8.6 4.8 9.9 5.7 9.9 7.3A1.9 1.9 0 0 1 6.1 7.3C6.1 5.7 7.4 4.8 8 3.2Z"/>
      <path fill="#C8A45A" d="M7.3 10H8.7V12.8H7.3Z"/>
    </symbol>
    <!-- Marque de tâcheron J.D. : J et D partagent la haste ; le crochet du J arrondit le pied du D -->
    <symbol id="marque-jd" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="butt" d="M10.5 16.5V4H12.5A8 8 0 0 1 12.5 20H7A3.5 3.5 0 0 1 3.5 16.5V15"/>
      <path fill="currentColor" d="M15 10.25L16.75 12L15 13.75L13.25 12Z"/>
    </symbol>
  </defs>
  <!-- Disque de fond : permet au sceau de tenir sur parchemin. À masquer (fill:none) en version encre. -->
  <circle id="sceau-fond" r="252" fill="#0B0A0A"/>
  <g id="sceau-listel" fill="none">
    <circle class="listel-gras" r="247" stroke="#C8A45A" stroke-width="3"/>
    <circle class="listel-maigre" r="239.5" stroke="#A8854D" stroke-width="1"/>
  </g>
