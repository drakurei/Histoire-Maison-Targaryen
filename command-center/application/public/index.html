<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Targaryen Command Center</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#view">Aller au contenu</a>

  <header class="top">
    <div class="brand">
      <svg class="brand__seal" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" class="seal-ring"/>
        <circle cx="32" cy="32" r="23" class="seal-ring seal-ring--thin"/>
        <path d="M10 32 Q32 12 54 32 Q32 52 10 32 Z" class="seal-eye"/>
        <path d="M32 19 Q37 32 32 45 Q27 32 32 19 Z" class="seal-pupil"/>
      </svg>
      <div>
        <p class="brand__over">Targaryen Chronicles</p>
        <h1 class="brand__title">Command Center</h1>
      </div>
    </div>
    <div class="top__status" id="top-status" aria-live="polite"></div>
    <div class="top__controls" id="global-controls"></div>
  </header>

  <nav class="tabs" aria-label="Vues du Command Center">
    <a href="#/" data-view="overview">Tableau de bord</a>
    <a href="#/agents" data-view="agents">Agents</a>
    <a href="#/taches" data-view="tasks">Tâches</a>
    <a href="#/decisions" data-view="decisions">Décisions</a>
    <a href="#/problemes" data-view="issues">Problèmes</a>
    <a href="#/rapports" data-view="reports">Rapports</a>
    <a href="#/journal" data-view="journal">Historique</a>
  </nav>

  <p class="notice" id="notice" role="status"></p>

  <main id="view" tabindex="-1"></main>

  <dialog id="agent-dialog" class="sheet" aria-labelledby="agent-dialog-title"></dialog>
  <dialog id="report-dialog" class="sheet sheet--wide" aria-labelledby="report-dialog-title"></dialog>

  <dialog id="note-dialog" class="sheet sheet--small" aria-labelledby="note-title">
    <form method="dialog" id="note-form">
      <h2 id="note-title" class="sheet__title"></h2>
      <p id="note-help" class="sheet__help"></p>
      <label class="field">
        <span id="note-label">Motif</span>
        <textarea id="note-input" rows="4" maxlength="1000"></textarea>
      </label>
      <p class="field__error" id="note-error" role="alert"></p>
      <div class="sheet__actions">
        <button type="button" class="btn btn--ghost" id="note-cancel">Annuler</button>
        <button type="submit" class="btn btn--primary" id="note-submit">Envoyer la demande</button>
      </div>
    </form>
  </dialog>

  <footer class="foot">
    <p>Interface locale — accessible uniquement depuis cet ordinateur (127.0.0.1). Aucune donnée n'est envoyée sur Internet.</p>
    <p id="foot-sync"></p>
  </footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
